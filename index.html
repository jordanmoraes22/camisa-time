<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camisa do Time - Pro Clubs</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f0f0f; color: white; margin: 0; padding: 20px; }
        h1 { color: #25d366; margin-bottom: 30px; text-align: center; }
        
        .main-container { display: flex; flex-direction: column; align-items: center; gap: 20px; }

        /* Container das Camisas */
        .camisas-wrapper { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; width: 100%; }

        .camisa-box { 
            position: relative; 
            width: 320px; 
            min-height: 400px; 
            background-color: #1a1a1a; 
            border-radius: 10px;
            overflow: hidden;
        }

        .camisa-img { width: 100%; display: block; }

        /* Ajuste do Nome e Número */
        .txt-nome {
            position: absolute;
            top: 22%; /* Se o nome ficar alto ou baixo demais, mude esse número */
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            text-align: center;
            pointer-events: none;
        }

        .txt-numero {
            position: absolute;
            top: 35%; /* Se o número ficar alto ou baixo demais, mude esse número */
            left: 50%;
            transform: translateX(-50%);
            font-size: 110px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.8);
            pointer-events: none;
        }

        /* Formulário */
        .form-area { 
            background: #1a1a1a; 
            padding: 25px; 
            border-radius: 15px; 
            width: 100%; 
            max-width: 350px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            margin-top: 20px;
        }
        
        label { display: block; text-align: left; margin: 10px 0 5px 5px; font-size: 14px; color: #aaa; }
        input, select { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #333; background: #222; color: white; box-sizing: border-box; }
        
        button { 
            width: 100%; 
            padding: 15px; 
            background: #25d366; 
            color: black; 
            border: none; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 8px; 
            transition: 0.3s;
        }
        button:hover { background: #1eb954; transform: scale(1.02); }

        p.legenda { margin: 5px 0; font-weight: bold; color: #888; text-align: center; }
    </style>
</head>
<body>

    <h1>Personalize seu Manto</h1>

    <div class="main-container">
        
        <div class="camisas-wrapper">
            <!-- Frente -->
            <div class="camisa-box">
                <p class="legenda">FRENTE</p>
                <img src="Frente.png" class="camisa-img" id="imgFrente">
            </div>

            <!-- Costas -->
            <div class="camisa-box">
                <p class="legenda">COSTAS</p>
                <img src="Costas.png" class="camisa-img" id="imgCostas">
                <div id="displayNome" class="txt-nome">SEU NOME</div>
                <div id="displayNumero" class="txt-numero">00</div>
            </div>
        </div>

        <div class="form-area">
            <label>NOME COMPLETO</label>
            <input type="text" id="nomePessoa" placeholder="Seu Nome Real">
            
            <label>NOME NA CAMISA</label>
            <input type="text" id="nomeCamisa" placeholder="Ex: JORDAN" maxlength="15" oninput="atualizar()">
            
            <label>NÚMERO</label>
            <input type="number" id="numeroCamisa" placeholder="Ex: 10" oninput="atualizar()">
            
            <label>PAGAMENTO</label>
            <select id="pagamento">
                <option value="50">Pagar Metade (R$ 50,00)</option>
                <option value="100">Pagar Total (R$ 100,00)</option>
            </select>

            <button onclick="concluir()">CONCLUIR PEDIDO</button>
        </div>
    </div>

    <script>
        function atualizar() {
            let nome = document.getElementById('nomeCamisa').value;
            let num = document.getElementById('numeroCamisa').value;
            
            // Atualiza o texto na camisa em tempo real
            document.getElementById('displayNome').innerText = nome.toUpperCase() || "SEU NOME";
            document.getElementById('displayNumero').innerText = num || "00";
        }

        function concluir() {
            const nPessoa = document.getElementById('nomePessoa').value;
            const nCamisa = document.getElementById('nomeCamisa').value;
            const nNum = document.getElementById('numeroCamisa').value;

            if(!nPessoa || !nCamisa || !nNum) {
                alert("Por favor, preencha todos os campos antes de continuar!");
                return;
            }

            alert("Dados registrados com sucesso! Vamos para a etapa do pagamento.");
        }
    </script>
</body>
</html>
