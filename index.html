<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trem do Ódio EC - Landing</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
        body { background: #000; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 20px; text-align: center; }
        .logo { width: 200px; margin: 20px 0; }
        h1 { color: #cc0000; font-family: 'Impact', sans-serif; margin-bottom: 20px; }
        .btn { display: block; width: 100%; max-width: 300px; padding: 15px; margin: 10px 0; border-radius: 8px; font-weight: bold; text-decoration: none; cursor: pointer; border: none; font-size: 16px; }
        .btn-pedir { background: #cc0000; color: #fff; }
        .btn-restante { background: #333; color: #fff; border: 1px solid #444; }
        .aviso { font-size: 12px; color: #888; margin-top: 20px; max-width: 300px; }
    </style>
</head>
<body>
    <img src="Logo.png" alt="Logo" class="logo">
    <h1>TREM DO ÓDIO EC</h1>

    <button onclick="novoPedido()" class="btn btn-pedir">QUERO PEDIR MINHA CAMISA</button>
    <button onclick="pagarRestante()" class="btn btn-restante">PAGAR VALOR RESTANTE</button>

    <p class="aviso">Prazo de fabricação: 30 dias após confirmação do pagamento.</p>

    <script>
        function novoPedido() {
            localStorage.clear();
            window.location.href = 'pedido.html';
        }

        function pagarRestante() {
            const tel = prompt("Digite seu WhatsApp com DDD (somente números):");
            if (tel) {
                const cleanTel = tel.replace(/\D/g, '');
                if (cleanTel.length >= 10) {
                    localStorage.setItem('user_whatsapp', cleanTel);
                    window.location.href = 'pagamento.html?modo=consulta';
                } else {
                    alert("Telefone inválido.");
                }
            }
        }
    </script>
</body>
</html>
