<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trem do Ódio EC - Camisas</title>
    <style>
        :root {
            --vermelho: #cc0000;
            --preto: #000000;
            --cinza: #1a1a1a;
        }

        body { 
            font-family: 'Arial', sans-serif; 
            background-color: var(--preto); 
            color: white; 
            margin: 0; 
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { 
            color: var(--vermelho); 
            font-size: 18px; 
            text-transform: uppercase; 
            margin: 15px 0;
            text-align: center;
            font-family: 'Impact', sans-serif;
            letter-spacing: 1px;
        }
        
        .preview-container {
            display: flex;
            flex-direction: row;
            gap: 10px;
            justify-content: center;
            width: 100%;
            max-width: 500px;
        }

        .camisa-box { 
            position: relative; 
            width: 48%; 
            background-color: var(--cinza); 
            border-radius: 8px;
            border: 1px solid #333;
        }

        .camisa-img { width: 100%; display: block; border-radius: 8px; }

        /* AREA DO NOME - Limitada pelas linhas azuis (68% de largura) */
        .txt-nome-container {
            position: absolute;
            top: 22%; /* Posicionado na altura certa das costas */
            left: 50%;
            transform: translateX(-50%);
            width: 68%; /* LARGURA CRÍTICA: Ajustada para as suas linhas azuis */
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; /* Garante que nada saia das linhas */
        }

        #displayNome {
            font-family: 'Impact', sans-serif;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            white-space: nowrap;
            display: block;
            line-height: 1;
        }

        /* AREA DO NÚMERO */
        .txt-numero {
            position: absolute;
            top: 36%;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Impact', sans-serif;
            font-size: 50px;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
        }

        /* Formulário */
        .form-area { 
            background: var(--cinza); 
            padding: 20px; 
            border-radius: 15px; 
            width: 95%; 
            max-width: 400px; 
            margin-top: 20px;
            border-top: 4px solid var(--vermelho);
            box-sizing: border-box;
        }
        
        label { display: block; text-align: left; margin: 10px 0 5px; font-size: 11px; color: #ff9999; font-weight: bold; text-transform: uppercase; }
        
        input { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 10px; 
            border-radius: 5px; 
            border: 1px solid #444; 
            background: #000; 
            color: white; 
            box-sizing: border-box;
            font-size: 16px;
        }

        button { 
            width: 100%; 
            padding: 15px; 
            background: var(--vermelho); 
            color: white; 
            border: none; 
            font-size: 18px; 
            font-weight: bold; 
            border-radius: 5px; 
            margin-top: 10px;
            text-transform: uppercase;
        }

        .legenda { font-size: 10px; color: #888; margin: 5px 0; text-align: center; }

    </style>
</head>
<body>

    <h1>Sua camisa do Trem do Ódio EC</h1>

    <div class="preview-container">
        <div class="camisa-box">
            <p class="legenda">FRENTE</p>
            <img src="Frente.png" class="camisa-img">
        </div>

        <div class="camisa-box">
            <p class="legenda">COSTAS</p>
            <img src="Costas.png" class="camisa-img">
            <div class="txt-nome-container">
                <span id="displayNome">MICHAEL JORDAN</span>
            </div>
            <div id="displayNumero" class="txt-numero">00</div>
        </div>
    </div>

    <div class="form-area">
        <label>Nome na Camisa</label>
        <input type="text" id="nomeCamisa" placeholder="Ex: MICHAEL JORDAN" oninput="atualizar()">
        
        <label>Número (00-99)</label>
        <input type="number" id="numeroCamisa" placeholder="10" oninput="validarNumero()">
        
        <button onclick="concluir()">CONCLUIR PEDIDO</button>
    </div>

    <script>
        function validarNumero() {
            let campo = document.getElementById('numeroCamisa');
            if (campo.value.length > 2) campo.value = campo.value.slice(0, 2);
            atualizar();
        }

        function atualizar() {
            let nomeInput = document.getElementById('nomeCamisa').value;
            let numInput = document.getElementById('numeroCamisa').value;
            
            const displayNome = document.getElementById('displayNome');
            const displayNumero = document.getElementById('displayNumero');
            const container = document.querySelector('.txt-nome-container');

            // 1. Atualiza o Número
            displayNumero.innerText = numInput === "" ? "00" : numInput.toString().padStart(2, '0');

            // 2. Atualiza o Nome
            displayNome.innerText = nomeInput.toUpperCase() || "MICHAEL JORDAN";

            // 3. LOGICA DE ENCAIXE RIGOROSO
            let fontSize = 22; // Tamanho inicial máximo
            displayNome.style.fontSize = fontSize + "px";

            // Enquanto a largura real do texto (scrollWidth) for maior que o container (68%), 
            // ele diminui a fonte de 1 em 1 pixel.
            while (displayNome.scrollWidth > container.offsetWidth && fontSize > 8) {
                fontSize--;
                displayNome.style.fontSize = fontSize + "px";
            }
        }
    </script>
</body>
</html>
