<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trem do Ódio EC - Personalize sua Camisa</title>
    <style>
        :root {
            --vermelho: #cc0000;
            --preto: #000000;
            --cinza: #1a1a1a;
        }

        body { 
            font-family: 'Arial', sans-serif; 
            background-color: var(--preto); 
            color: white; 
            margin: 0; 
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { 
            color: var(--vermelho); 
            font-size: 18px; 
            text-transform: uppercase; 
            margin: 15px 0;
            text-align: center;
            font-family: 'Impact', sans-serif;
            letter-spacing: 1px;
        }
        
        .preview-container {
            display: flex;
            flex-direction: row;
            gap: 10px;
            justify-content: center;
            width: 100%;
            max-width: 500px;
        }

        .camisa-box { 
            position: relative; 
            width: 48%; 
            background-color: var(--cinza); 
            border-radius: 8px;
            border: 1px solid #333;
        }

        .camisa-img { width: 100%; display: block; border-radius: 8px; }

        .txt-nome-container {
            position: absolute;
            top: 22%; 
            left: 50%;
            transform: translateX(-50%);
            width: 58%; 
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #displayNome {
            font-family: 'Impact', sans-serif;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            white-space: nowrap;
            display: block;
            line-height: 1;
        }

        .txt-numero {
            position: absolute;
            top: 36%;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Impact', sans-serif;
            font-size: 50px;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
        }

        /* Formulário */
        .form-area { 
            background: var(--cinza); 
            padding: 20px; 
            border-radius: 15px; 
            width: 95%; 
            max-width: 400px; 
            margin-top: 20px;
            border-top: 4px solid var(--vermelho);
            box-sizing: border-box;
            margin-bottom: 30px;
        }
        
        label { display: block; text-align: left; margin: 12px 0 5px; font-size: 11px; color: #ff9999; font-weight: bold; text-transform: uppercase; }
        
        input, select { 
            width: 100%; 
            padding: 12px; 
            border-radius: 5px; 
            border: 1px solid #444; 
            background: #000; 
            color: white; 
            box-sizing: border-box;
            font-size: 14px;
        }

        /* Container do Tamanho com botão de info */
        .tamanho-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn-info {
            background: #444;
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-weight: bold;
            font-style: italic;
            cursor: pointer;
            font-family: serif;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button.btn-proximo { 
            width: 100%; 
            padding: 15px; 
            background: var(--vermelho); 
            color: white; 
            border: none; 
            font-size: 18px; 
            font-weight: bold; 
            border-radius: 5px; 
            margin-top: 20px;
            text-transform: uppercase;
            cursor: pointer;
        }

        /* Modal da Tabela de Tamanhos */
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            max-width: 90%;
            max-height: 80%;
        }
        .modal-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            cursor: pointer;
        }

        .legenda { font-size: 10px; color: #888; margin: 5px 0; text-align: center; }

    </style>
</head>
<body>

    <h1>Personalize sua Camisa</h1>

    <div class="preview-container">
        <div class="camisa-box">
            <p class="legenda">FRENTE</p>
            <img src="Frente.png" class="camisa-img">
        </div>

        <div class="camisa-box">
            <p class="legenda">COSTAS</p>
            <img src="Costas.png" class="camisa-img">
            <div class="txt-nome-container">
                <span id="displayNome">JORDAN</span>
            </div>
            <div id="displayNumero" class="txt-numero">00</div>
        </div>
    </div>

    <div class="form-area">
        <label>Seu Nome</label>
        <input type="text" id="nomeIdentificacao" placeholder="Ex: João Silva">

        <label>Nome na Camisa</label>
        <input type="text" id="nomeCamisa" placeholder="Ex: MICHAEL JORDAN" oninput="atualizar()">
        
        <label>Número (00-99)</label>
        <input type="number" id="numeroCamisa" placeholder="10" oninput="validarNumero()">

        <label>Tamanho</label>
        <div class="tamanho-wrapper">
            <select id="tamanhoCamisa">
                <option value="P">P</option>
                <option value="M">M</option>
                <option value="G">G</option>
                <option value="GG">GG</option>
                <option value="XG">XG</option>
            </select>
            <button class="btn-info" onclick="abrirModal()">i</button>
        </div>
        
        <button class="btn-proximo" onclick="irParaPagamento()">PROSSEGUIR PARA PAGAMENTO</button>
    </div>

    <!-- Modal -->
    <div id="modalTamanho" class="modal">
        <span class="modal-close" onclick="fecharModal()">&times;</span>
        <img src="Tamanho.png" class="modal-content">
    </div>

    <script>
        function validarNumero() {
            let campo = document.getElementById('numeroCamisa');
            if (campo.value.length > 2) campo.value = campo.value.slice(0, 2);
            atualizar();
        }

        function atualizar() {
            let nomeInput = document.getElementById('nomeCamisa').value;
            let numInput = document.getElementById('numeroCamisa').value;
            const displayNome = document.getElementById('displayNome');
            const displayNumero = document.getElementById('displayNumero');
            const container = document.querySelector('.txt-nome-container');

            displayNumero.innerText = numInput === "" ? "00" : numInput.toString().padStart(2, '0');
            displayNome.innerText = nomeInput.toUpperCase() || "JORDAN";

            let fontSize = 22; 
            displayNome.style.fontSize = fontSize + "px";
            while (displayNome.scrollWidth > container.offsetWidth && fontSize > 8) {
                fontSize--;
                displayNome.style.fontSize = fontSize + "px";
            }
        }

        function abrirModal() { document.getElementById('modalTamanho').style.display = "flex"; }
        function fecharModal() { document.getElementById('modalTamanho').style.display = "none"; }

        function irParaPagamento() {
            const dados = {
                identificacao: document.getElementById('nomeIdentificacao').value,
                nomeCamisa: document.getElementById('nomeCamisa').value,
                numero: document.getElementById('numeroCamisa').value,
                tamanho: document.getElementById('tamanhoCamisa').value
            };

            if(!dados.identificacao || !dados.nomeCamisa || !dados.numero) {
                alert("Por favor, preencha todos os campos!");
                return;
            }

            // Salva na memória do navegador
            localStorage.setItem('pedidoCamisa', JSON.stringify(dados));
            
            // Redireciona para a página de pagamento
            window.location.href = "pagamento.html";
        }
    </script>
</body>
</html>
