<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trem do Ódio EC - Camisas</title>
    <style>
        :root {
            --vermelho: #cc0000;
            --preto: #000000;
            --cinza: #1a1a1a;
        }

        body { 
            font-family: 'Arial', sans-serif; 
            background-color: var(--preto); 
            color: white; 
            margin: 0; 
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { 
            color: var(--vermelho); 
            font-size: 18px; 
            text-transform: uppercase; 
            margin: 15px 0;
            text-align: center;
            line-height: 1.2;
            font-family: 'Impact', sans-serif;
            letter-spacing: 1px;
        }
        
        .preview-container {
            display: flex;
            flex-direction: row;
            gap: 10px;
            justify-content: center;
            width: 100%;
            max-width: 500px;
        }

        .camisa-box { 
            position: relative; 
            width: 48%; 
            background-color: var(--cinza); 
            border-radius: 8px;
            border: 1px solid #333;
            overflow: hidden; /* Importante para cortar textos que ultrapassarem a imagem */
        }

        .camisa-img { width: 100%; display: block; border-radius: 8px; }

        /* CONTAINER DO NOME - Posicionado exatamente na área de impressão das costas */
        .txt-nome-container {
            position: absolute;
            top: 19%; /* Ajustado para baixo, longe do pescoço */
            left: 50%;
            transform: translateX(-50%);
            width: 92%; /* Ocupa quase toda a largura dos ombros */
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 10;
        }

        #displayNome {
            font-family: 'Impact', sans-serif;
            font-size: 20px;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
            white-space: nowrap;
            display: inline-block;
            transition: font-size 0.2s ease;
        }

        /* CONTAINER DO NÚMERO */
        .txt-numero {
            position: absolute;
            top: 40%; /* Ajustado para o centro das costas */
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Impact', sans-serif;
            font-size: 55px;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 5;
        }

        /* Formulário */
        .form-area { 
            background: var(--cinza); 
            padding: 20px; 
            border-radius: 15px; 
            width: 90%; 
            max-width: 400px; 
            margin-top: 20px;
            border-top: 4px solid var(--vermelho);
            box-sizing: border-box;
        }
        
        label { display: block; text-align: left; margin: 10px 0 5px; font-size: 12px; color: #ff9999; font-weight: bold; text-transform: uppercase; }
        
        input, select { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 10px; 
            border-radius: 5px; 
            border: 1px solid #444; 
            background: #000; 
            color: white; 
            box-sizing: border-box;
            font-size: 16px;
        }

        input:focus { border-color: var(--vermelho); outline: none; }
        
        button { 
            width: 100%; 
            padding: 15px; 
            background: var(--vermelho); 
            color: white; 
            border: none; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 5px; 
            margin-top: 10px;
            text-transform: uppercase;
        }

        .legenda { font-size: 10px; color: #888; margin: 5px 0; text-align: center; font-family: sans-serif; }

    </style>
</head>
<body>

    <h1>Sua camisa do Trem do Ódio EC</h1>

    <div class="preview-container">
        <div class="camisa-box">
            <p class="legenda">FRENTE</p>
            <img src="Frente.png" class="camisa-img">
        </div>

        <div class="camisa-box">
            <p class="legenda">COSTAS</p>
            <img src="Costas.png" class="camisa-img">
            
            <!-- Overlay do Nome -->
            <div class="txt-nome-container">
                <span id="displayNome">JORDAN</span>
            </div>
            
            <!-- Overlay do Número -->
            <div id="displayNumero" class="txt-numero">00</div>
        </div>
    </div>

    <div class="form-area">
        <label>Seu Nome</label>
        <input type="text" id="nomePessoa" placeholder="Para identificação">
        
        <label>Nome na Camisa</label>
        <input type="text" id="nomeCamisa" placeholder="Exemplo Como Michael Jordan" oninput="atualizar()">
        
        <label>Número (00-99)</label>
        <input type="number" id="numeroCamisa" placeholder="10" oninput="validarNumero()">
        
        <label>Opção de Pagamento</label>
        <select id="pagamento">
            <option value="50">PAGAR METADE (R$ 50,00)</option>
            <option value="100">PAGAR TOTAL (R$ 100,00)</option>
        </select>

        <button onclick="concluir()">CONCLUIR PEDIDO</button>
    </div>

    <script>
        function validarNumero() {
            let campo = document.getElementById('numeroCamisa');
            if (campo.value.length > 2) {
                campo.value = campo.value.slice(0, 2);
            }
            atualizar();
        }

        function atualizar() {
            let nomeInput = document.getElementById('nomeCamisa').value;
            let numInput = document.getElementById('numeroCamisa').value;
            
            const displayNome = document.getElementById('displayNome');
            const displayNumero = document.getElementById('displayNumero');
            const container = document.querySelector('.txt-nome-container');

            // 1. Atualiza o Número
            displayNumero.innerText = numInput === "" ? "00" : numInput.toString().padStart(2, '0');

            // 2. Atualiza o Nome
            let text = nomeInput.toUpperCase() || "JORDAN";
            displayNome.innerText = text;

            // 3. Lógica Matemática de Tamanho de Fonte (Sem deformação)
            const containerWidth = container.offsetWidth;
            const textLength = text.length;

            // Fórmula: Cada letra em 'Impact' ocupa aproximadamente 58% do tamanho da fonte.
            // Para caber na largura do container:
            // fontSize * textLength * 0.58 <= containerWidth
            // fontSize <= containerWidth / (textLength * 0.58)

            let calculatedSize = containerWidth / (textLength * 0.58);

            // Limita a tamanho entre 15px (mínimo legível) e 24px (máximo padrão de camisa)
            let finalSize = Math.max(15, Math.min(24, calculatedSize));

            displayNome.style.fontSize = finalSize + "px";
        }

        function concluir() {
            const nPessoa = document.getElementById('nomePessoa').value;
            const nCamisa = document.getElementById('nomeCamisa').value;
            const nNum = document.getElementById('numeroCamisa').value;

            if(!nPessoa || !nCamisa || !nNum) {
                alert("Preencha todos os dados antes de concluir!");
                return;
            }

            alert("Dados registrados! Preparando o pagamento...");
        }
    </script>
</body>
</html>
