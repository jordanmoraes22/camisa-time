<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trem do Ódio EC - Camisas</title>
    <style>
        :root {
            --vermelho: #cc0000;
            --preto: #000000;
            --cinza: #1a1a1a;
        }

        body { 
            font-family: 'Arial', sans-serif; 
            background-color: var(--preto); 
            color: white; 
            margin: 0; 
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { 
            color: var(--vermelho); 
            font-size: 18px; 
            text-transform: uppercase; 
            margin: 15px 0;
            text-align: center;
            font-family: 'Impact', sans-serif;
            letter-spacing: 1px;
        }
        
        .preview-container {
            display: flex;
            flex-direction: row;
            gap: 10px;
            justify-content: center;
            width: 100%;
            max-width: 500px;
        }

        .camisa-box { 
            position: relative; 
            width: 48%; 
            background-color: var(--cinza); 
            border-radius: 8px;
            border: 1px solid #333;
        }

        .camisa-img { width: 100%; display: block; border-radius: 8px; }

        /* AREA DO NOME - Agora com 58% para ficar longe dos ombros */
        .txt-nome-container {
            position: absolute;
            top: 22%; 
            left: 50%;
            transform: translateX(-50%);
            width: 58%; /* REDUZIDO para não tocar os ombros */
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #displayNome {
            font-family: 'Impact', sans-serif;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            white-space: nowrap;
            display: block;
            line-height: 1;
        }

        /* AREA DO NÚMERO */
        .txt-numero {
            position: absolute;
            top: 36%;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Impact', sans-serif;
            font-size: 50px;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
        }

        /* Formulário */
        .form-area { 
            background: var(--cinza); 
            padding: 20px; 
            border-radius: 15px; 
            width: 95%; 
            max-width: 400px; 
            margin-top: 20px;
            border-top: 4px solid var(--vermelho);
            box-sizing: border-box;
            margin-bottom: 30px;
        }
        
        label { display: block; text-align: left; margin: 12px 0 5px; font-size: 11px; color: #ff9999; font-weight: bold; text-transform: uppercase; }
        
        input, select { 
            width: 100%; 
            padding: 12px; 
            border-radius: 5px; 
            border: 1px solid #444; 
            background: #000; 
            color: white; 
            box-sizing: border-box;
            font-size: 14px;
        }

        input:focus, select:focus { border-color: var(--vermelho); outline: none; }

        button { 
            width: 100%; 
            padding: 15px; 
            background: var(--vermelho); 
            color: white; 
            border: none; 
            font-size: 18px; 
            font-weight: bold; 
            border-radius: 5px; 
            margin-top: 20px;
            text-transform: uppercase;
            cursor: pointer;
        }

        .legenda { font-size: 10px; color: #888; margin: 5px 0; text-align: center; }

    </style>
</head>
<body>

    <h1>Sua camisa do Trem do Ódio EC</h1>

    <div class="preview-container">
        <div class="camisa-box">
            <p class="legenda">FRENTE</p>
            <img src="Frente.png" class="camisa-img">
        </div>

        <div class="camisa-box">
            <p class="legenda">COSTAS</p>
            <img src="Costas.png" class="camisa-img">
            <div class="txt-nome-container">
                <span id="displayNome">JORDAN</span>
            </div>
            <div id="displayNumero" class="txt-numero">00</div>
        </div>
    </div>

    <div class="form-area">
        <!-- Campo de Identificação -->
        <label>Seu Nome Completo</label>
        <input type="text" id="nomePessoa" placeholder="Para identificação do pedido">

        <!-- Customização da Camisa -->
        <label>Nome na Camisa</label>
        <input type="text" id="nomeCamisa" placeholder="Ex: MICHAEL JORDAN" oninput="atualizar()">
        
        <label>Número (00-99)</label>
        <input type="number" id="numeroCamisa" placeholder="10" oninput="validarNumero()">

        <!-- Tamanho -->
        <label>Tamanho da Camisa</label>
        <select id="tamanhoCamisa">
            <option value="P">P</option>
            <option value="M">M</option>
            <option value="G">G</option>
            <option value="GG">GG</option>
            <option value="XG">XG (Sob consulta)</option>
        </select>

        <!-- Pagamento (Mantive para o fluxo fazer sentido) -->
        <label>Opção de Pagamento</label>
        <select id="pagamento">
            <option value="50">PAGAR METADE (R$ 50,00)</option>
            <option value="100">PAGAR TOTAL (R$ 100,00)</option>
        </select>
        
        <button onclick="concluir()">CONCLUIR PEDIDO</button>
    </div>

    <script>
        function validarNumero() {
            let campo = document.getElementById('numeroCamisa');
            if (campo.value.length > 2) campo.value = campo.value.slice(0, 2);
            atualizar();
        }

        function atualizar() {
            let nomeInput = document.getElementById('nomeCamisa').value;
            let numInput = document.getElementById('numeroCamisa').value;
            
            const displayNome = document.getElementById('displayNome');
            const displayNumero = document.getElementById('displayNumero');
            const container = document.querySelector('.txt-nome-container');

            // 1. Atualiza o Número
            displayNumero.innerText = numInput === "" ? "00" : numInput.toString().padStart(2, '0');

            // 2. Atualiza o Nome
            displayNome.innerText = nomeInput.toUpperCase() || "JORDAN";

            // 3. LOGICA DE ENCAIXE RIGOROSO
            let fontSize = 22; 
            displayNome.style.fontSize = fontSize + "px";

            // Verifica se o nome cabe no container de 58% de largura
            while (displayNome.scrollWidth > container.offsetWidth && fontSize > 8) {
                fontSize--;
                displayNome.style.fontSize = fontSize + "px";
            }
        }

        function concluir() {
            const nPessoa = document.getElementById('nomePessoa').value;
            const nCamisa = document.getElementById('nomeCamisa').value;
            const nNum = document.getElementById('numeroCamisa').value;
            const tamanho = document.getElementById('tamanhoCamisa').value;

            if(!nPessoa || !nCamisa || !nNum) {
                alert("Por favor, preencha seu nome, o nome na camisa e o número!");
                return;
            }

            // Próximo passo será a integração com Google Sheets e PIX
            alert("Pedido de " + nPessoa + " (Tam: " + tamanho + ") registrado com sucesso!");
        }
    </script>
</body>
</html>
