<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Trem do Ódio EC – Camisas</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
    body{background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;padding:20px;text-align:center}
    .logo{width:180px;margin:15px 0}
    h1{color:#cc0000;font-family:'Impact',sans-serif;margin:10px 0}
    .btn{display:block;width:100%;max-width:300px;padding:14px;margin:8px 0;border-radius:8px;font-weight:bold;font-size:15px;border:none;color:#fff;cursor:pointer}
    .btn-pedir{background:#cc0000}
    .btn-restante{background:#333;border:1px solid #444}
    .aviso{font-size:12px;color:#888;margin-top:15px}
    .whats{background:#25D366;color:#fff;padding:14px;border-radius:8px;margin-top:20px;display:block;text-decoration:none;font-weight:bold}
    /* Modal para digitar o WhatsApp (teclado numérico) */
    #modalZap{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);justify-content:center;align-items:center}
    #modalZap .box{background:#111;padding:20px;border-radius:10px;width:90%;max-width:300px}
    #modalZap input{width:100%;padding:12px;font-size:16px;margin-top:10px;border-radius:6px;border:none;background:#222;color:#fff}
    #modalZap button{margin-top:12px;padding:10px;width:100%;background:#cc0000;color:#fff;border:none;border-radius:6px;font-weight:bold}
</style>
</head>
<body>

<img src="Logo.png" alt="Logo" class="logo">
<h1>TREM DO ÓDIO EC</h1>

<button class="btn btn-pedir" onclick="novoPedido()">QUERO PEDIR MINHA CAMISA</button>
<button class="btn btn-restante" onclick="abrirModalZap()">PAGAR VALOR RESTANTE</button>

<p class="aviso">Prazo de fabricação: 30 dias após confirmação do pagamento.</p>

<a href="https://wa.me/5531991595612?text=Olá! Tenho dúvidas sobre a camisa do Trem do Ódio EC."
   target="_blank" class="whats">Tenho dúvidas / Falar no WhatsApp</a>

<!-- ===== MODAL WHATSAPP ===== -->
<div id="modalZap">
    <div class="box">
        <h3>Digite seu WhatsApp (DDD + número)</h3>
        <input id="zapInput" type="tel" inputmode="numeric" placeholder="ex.: 31991595612" maxlength="13">
        <button onclick="pagarRestante()">Continuar</button>
    </div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxj4MLJomXHbuuMYxJPEyd2mtoZcLANLjtkxCmNDcCQQFegveL6atlWm79qjSa-KwsZPA/exec';

function novoPedido(){
    localStorage.clear();                     // limpa dados antigos
    window.location.href='pedido.html';
}

/* ---- MODAL WHATSAPP ---- */
function abrirModalZap(){ document.getElementById('modalZap').style.display='flex'; }
function fecharModalZap(){ document.getElementById('modalZap').style.display='none'; }

function pagarRestante(){
    const raw = document.getElementById('zapInput').value.replace(/\D/g,'');
    if(raw.length<10){
        alert('Telefone inválido – digite ao menos 10 números.');
        return;
    }
    // impede que o usuário vá direto ao pagamento sem ter criado um pedido
    const temPedido = !!localStorage.getItem('pedidoCamisa');
    if(!temPedido){
        if(!confirm('Você ainda não fez nenhum pedido. Deseja voltar e criar um?')){
            fecharModalZap();
            return;
        }
        fecharModalZap();
        window.location.href='pedido.html';
        return;
    }
    localStorage.setItem('user_whatsapp', raw);
    fecharModalZap();
    window.location.href='pagamento.html?modo=consulta';
}
</script>
</body>
</html>
