<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento - Trem do Ódio EC</title>
    <style>
        :root { --vermelho: #cc0000; --preto: #000000; --cinza: #1a1a1a; }
        body { font-family: 'Arial', sans-serif; background: var(--preto); color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .card { background: var(--cinza); padding: 20px; border-radius: 15px; width: 100%; max-width: 400px; border-top: 4px solid var(--vermelho); text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: var(--vermelho); text-transform: uppercase; font-family: 'Impact'; margin-bottom: 5px; }
        .resumo { text-align: left; background: #000; padding: 15px; border-radius: 8px; margin: 15px 0; font-size: 14px; line-height: 1.6; border: 1px solid #333; }
        .resumo b { color: var(--vermelho); }
        
        .btn-pix { width: 100%; padding: 15px; margin: 8px 0; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s; display: flex; justify-content: space-between; align-items: center; }
        .btn-metade { background: #333; color: white; border: 1px solid #555; }
        .btn-total { background: var(--vermelho); color: white; }
        .btn-livre { background: #007bff; color: white; }
        .btn-pix:active { transform: scale(0.98); }

        #areaPix { display: none; margin-top: 20px; background: #fff; color: #000; padding: 15px; border-radius: 8px; animation: fadeIn 0.5s; }
        #codigoPix { word-break: break-all; font-family: monospace; font-size: 11px; margin: 10px 0; display: block; background: #eee; padding: 10px; border-radius: 4px; border: 1px dashed #ccc; }
        
        .btn-whatsapp { background: #25d366; color: white; width: 100%; border: none; padding: 18px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px; display: none; text-transform: uppercase; font-size: 16px; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3); }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .check-icon { font-size: 20px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Pagamento</h2>
        <p style="font-size: 13px; color: #aaa;">Toque em uma opção para copiar o código PIX</p>
        
        <div id="resumoPedido" class="resumo"></div>

        <button class="btn-pix btn-metade" onclick="selecionarPix('metade')">
            <span>Pagar Metade (50%)</span>
            <span>R$ 37,70</span>
        </button>
        
        <button class="btn-pix btn-total" onclick="selecionarPix('total')">
            <span>Pagar Total (100%)</span>
            <span>R$ 75,40</span>
        </button>

        <button class="btn-pix btn-livre" onclick="selecionarPix('livre')">
            <span>Outro Valor / Chave</span>
            <span class="check-icon">➔</span>
        </button>

        <div id="areaPix">
            <strong id="tituloPix">Código PIX Copiado!</strong>
            <span id="codigoPix"></span>
            <p style="font-size: 12px; margin: 0;">Abra o app do seu banco e use o <strong>PIX Copia e Cola</strong>.</p>
        </div>

        <button id="btnWhatsapp" class="btn-whatsapp" onclick="finalizar()">✅ Já paguei! Conferir na conta</button>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxj4MLJomXHbuuMYxJPEyd2mtoZcLANLjtkxCmNDcCQQFegveL6atlWm79qjSa-KwsZPA/exec';
        
        // Seus códigos PIX estáticos
        const PIX_CODES = {
            metade: "00020126360014br.gov.bcb.pix0114+5531991595612520400005303986540537.705802BR5913Jordan Moraes6009Sao Paulo62230519daqr2178720775081876304744C",
            total: "00020126360014br.gov.bcb.pix0114+5531991595612520400005303986540575.405802BR5913Jordan Moraes6009Sao Paulo62230519daqr217872077545874630494B4",
            livre: "00020126360014br.gov.bcb.pix0114+55319915956125204000053039865802BR5913Jordan Moraes6009Sao Paulo62230519daqr2178720771829146304B432"
        };

        let pedido = JSON.parse(localStorage.getItem('pedidoCamisa'));
        let opcaoEscolhida = "";

        if (!pedido) { window.location.href = "index.html"; }

        // Preenche resumo
        document.getElementById('resumoPedido').innerHTML = `
            👤 <b>Atleta:</b> ${pedido.identificacao}<br>
            👕 <b>Camisa:</b> ${pedido.nomeCamisa.toUpperCase()} | <b>Nº:</b> ${pedido.numero}<br>
            📏 <b>Tamanho:</b> ${pedido.tamanho}
        `;

        function selecionarPix(tipo) {
            opcaoEscolhida = tipo;
            const codigo = PIX_CODES[tipo];
            
            // Copia para o clipboard
            navigator.clipboard.writeText(codigo).then(() => {
                document.getElementById('codigoPix').innerText = codigo;
                document.getElementById('areaPix').style.display = "block";
                document.getElementById('btnWhatsapp').style.display = "block";
                
                // Feedback visual de copiado
                if(tipo === 'livre') {
                    document.getElementById('tituloPix').innerText = "Chave Copiada! (Valor Livre)";
                } else {
                    document.getElementById('tituloPix').innerText = "Código R$ " + (tipo === 'metade' ? '37,70' : '75,40') + " Copiado!";
                }
            });
        }

        function finalizar() {
            // 1. Envia para a planilha em background (sem travar)
            const dadosPlanilha = {
                identificacao: pedido.identificacao,
                nomeCamisa: pedido.nomeCamisa,
                numero: pedido.numero,
                tamanho: pedido.tamanho,
                opcaoPagamento: opcaoEscolhida,
                valorPago: "" // Você preenche na mão
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(dadosPlanilha)
            });

            // 2. Monta mensagem do Whats (sem valores, conforme pedido)
            const textoZap = `Fala bonitão,\nPaguei a camisa no site, quando puder confere aí na conta. E aqui, domingo (25/10) é 13 nas cabeças.\n\n*Pedido:* Camisa ${pedido.nomeCamisa.toUpperCase()} - Nº ${pedido.numero} - Tam ${pedido.tamanho}\n*Atleta:* ${pedido.identificacao}`;
            
            const linkZap = `https://api.whatsapp.com/send?phone=5531991595612&text=${encodeURIComponent(textoZap)}`;
            
            // Abre o whatsapp
            window.location.href = linkZap;
        }
    </script>
</body>
</html>
