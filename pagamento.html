<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Pagamento - Trem do Ódio</title>
    <style>
        :root{--red:#cc0000;--black:#000;--gray:#1a1a1a}
        body{background:var(--black);color:#fff;font-family:sans-serif;margin:0;padding:20px;display:flex;flex-direction:column;align-items:center}
        .card{background:var(--gray);padding:25px;border-radius:15px;width:100%;max-width:400px;border-top:4px solid var(--red);text-align:center}
        h2{font-family:'Impact';color:var(--red);margin:0 0 15px}
        .resumo{text-align:left;background:#000;padding:15px;border-radius:8px;font-size:14px;line-height:1.6;margin-bottom:20px;border:1px solid #333}
        .btn-pix{width:100%;padding:15px;margin:8px 0;border:none;border-radius:8px;font-weight:bold;cursor:pointer;display:flex;justify-content:space-between;background:#333;color:#fff}
        .btn-total{background:var(--red)}
        .btn-zap{background:#25d366;width:100%;padding:15px;border:none;border-radius:8px;color:#fff;font-weight:bold;margin-top:15px;cursor:pointer;display:none}
        #areaPix{display:none;background:#fff;color:#000;padding:10px;margin-top:10px;font-size:10px;border-radius:5px;word-break:break-all}
    </style>
</head>
<body>

<div class="card">
    <h2 id="status">BUSCANDO PARTIDA...</h2>
    <div id="resumo" class="resumo">Carregando dados da planilha...</div>

    <div id="boxPay" style="display:none">
        <button class="btn-pix" onclick="copyPix(37.70)"><span>PAGAR METADE (50%)</span><span>R$ 37,70</span></button>
        <button class="btn-pix btn-total" onclick="copyPixRestante()"><span>PAGAR RESTANTE</span><span id="txtFalta">R$ 75,40</span></button>
        <div id="areaPix"><b>PIX COPIADO! ✅</b><br><span id="code"></span></div>
        <button id="btnZap" class="btn-zap" onclick="goZap()">✅ JÁ PAGUEI! AVISAR NO WHATSAPP</button>
    </div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxj4MLJomXHbuuMYxJPEyd2mtoZcLANLjtkxCmNDcCQQFegveL6atlWm79qjSa-KwsZPA/exec";
let d = null;

async function init(){
    const zap = localStorage.getItem('user_whatsapp');
    try {
        const r = await fetch(SCRIPT_URL, {method:'POST', body: JSON.stringify({action:'GET_ORDER', whatsapp: zap})});
        const res = await r.json();
        if(res.status==='success'){
            d = res.data;
            document.getElementById('status').innerText = "PARTIDA ENCONTRADA!";
            document.getElementById('resumo').innerHTML = `👤 <b>${d.nome}</b><br>👕 ${d.camisaNome} (${d.camisaNumero})<br>💰 Total: R$ 75,40<br><span style="color:#25d366">✅ Pago: R$ ${d.valorPago.toLocaleString('pt-BR',{minimumFractionDigits:2})}</span>`;
            document.getElementById('boxPay').style.display = 'block';
            document.getElementById('txtFalta').innerText = `R$ ${(75.4 - d.valorPago).toLocaleString('pt-BR',{minimumFractionDigits:2})}`;
        }
    } catch(e) { document.getElementById('resumo').innerText = "Erro ao carregar ou pedido novo. Tente pagar usando os botões abaixo."; document.getElementById('boxPay').style.display = 'block'; }
}

function copyPix(val){
    const pix = `00020126360014br.gov.bcb.pix0114+5531991595612${val.toFixed(2).replace('.',',')}`;
    navigator.clipboard.writeText(pix);
    document.getElementById('code').innerText = pix;
    document.getElementById('areaPix').style.display = 'block';
    document.getElementById('btnZap').style.display = 'block';
}

function copyPixRestante(){ copyPix(d ? (75.4 - d.valorPago) : 75.4); }

function goZap(){
    window.location.href = `https://wa.me/5531991595612?text=Paguei minha camisa! Nome: ${d?d.nome:'Novo Pedido'}`;
}
init();
</script>
</body>
</html>
