<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Personalize sua Camisa – Trem do Ódio EC</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--vermelho:#cc0000;--preto:#000;--cinza:#1a1a1a}
body{font-family:Arial,sans-serif;background:#000;color:#fff;margin:0;padding:10px;display:flex;flex-direction:column;align-items:center}
h1{color:var(--vermelho);font-size:18px;text-transform:uppercase;font-family:'Impact',sans-serif;margin:15px 0;text-align:center}
.preview{display:flex;gap:10px;width:100%;max-width:500px}
.box{position:relative;width:48%;background:var(--cinza);border-radius:8px;border:1px solid #333}
.box img{width:100%;display:block;border-radius:8px}
.legenda{font-size:10px;color:#888;margin:5px 0;text-align:center}
.txt-nome{position:absolute;top:22%;left:50%;transform:translateX(-50%);width:58%;height:30px;display:flex;align-items:center;justify-content:center;overflow:hidden}
#displayNome{font-family:'Impact',sans-serif;color:#fff;text-transform:uppercase;font-size:22px;white-space:nowrap;line-height:1}
.txt-num{position:absolute;top:36%;left:50%;transform:translateX(-50%);font-family:'Impact',sans-serif;font-size:50px;color:#fff;text-shadow:2px 2px 4px rgba(0,0,0,.9)}
.form{background:var(--cinza);padding:20px;border-radius:15px;width:95%;max-width:400px;margin-top:20px;border-top:4px solid var(--vermelho);box-sizing:border-box}
label{display:block;margin:12px 0 5px;font-size:11px;color:#ff9999;font-weight:bold;text-transform:uppercase}
input,select{width:100%;padding:12px;border-radius:5px;border:1px solid #444;background:#000;color:#fff;font-size:14px;box-sizing:border-box}
.tamWrapper{display:flex;gap:10px;align-items:center}
.btnInfo{background:#444;color:#fff;width:40px;height:40px;border-radius:50%;font-weight:bold;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer}
button.prox{width:100%;padding:15px;background:var(--vermelho);color:#fff;border:none;border-radius:5px;margin-top:20px;font-size:18px;font-weight:bold;text-transform:uppercase;cursor:pointer}
button:disabled{background:#666;opacity:.7;cursor:not-allowed}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);justify-content:center;align-items:center;z-index:100}
.modal-content{max-width:90%;max-height:80%;border-radius:10px}
.modal-close{position:absolute;top:20px;right:25px;color:#fff;font-size:45px;font-weight:bold;cursor:pointer;z-index:110}
</style>
</head>
<body>

<h1>Personalize sua Camisa</h1>

<div class="preview">
    <div class="box"><p class="legenda">FRENTE</p><img src="Frente.png"></div>
    <div class="box">
        <p class="legenda">COSTAS</p>
        <img src="Costas.png">
        <div class="txt-nome"><span id="displayNome">SNOOP DOGG</span></div>
        <div id="displayNumero" class="txt-num">99</div>
    </div>
</div>

<div class="form">
    <label>WhatsApp (DDD + Número)</label>
    <input type="tel" id="whatsappCliente" placeholder="ex.: 31991595612" inputmode="numeric">

    <label>Seu Nome (Identificação)</label>
    <input type="text" id="nomeCliente" placeholder="ex.: Boneco Bot">

    <label>Nome na Camisa</label>
    <input type="text" id="nomeCamisa" placeholder="ex.: Snoop Dogg" oninput="atualizar()">

    <label>Número (00‑99)</label>
    <input type="number" id="numeroCamisa" placeholder="99" oninput="validarNumero()" inputmode="numeric">

    <label>Tamanho</label>
    <div class="tamWrapper">
        <select id="tamanhoCamisa">
            <option value="P">P</option>
            <option value="M">M</option>
            <option value="G" selected>G</option>
            <option value="GG">GG</option>
            <option value="XG">XG</option>
        </select>
        <button class="btnInfo" onclick="abrirModal()">i</button>
    </div>

    <button class="prox" id="btnEnviar" onclick="enviarPedido()">PROSSEGUIR PARA PAGAMENTO</button>
</div>

<!-- Modal Tamanho -->
<div id="modalTamanho" class="modal" onclick="fecharModalExterno(event)">
    <span class="modal-close" onclick="fecharModal()">&times;</span>
    <img src="Tamanho.png" class="modal-content" id="imgModal">
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxj4MLJomXHbuuMYxJPEyd2mtoZcLANLjtkxCmNDcCQQFegveL6atlWm79qjSa-KwsZPA/exec';

/* ===== PREVIEW (seu código original) ===== */
function validarNumero(){
    const c=document.getElementById('numeroCamisa');
    if(c.value.length>2) c.value=c.value.slice(0,2);
    atualizar();
}
function atualizar(){
    const nome=document.getElementById('nomeCamisa').value;
    const num=document.getElementById('numeroCamisa').value;
    const dNome=document.getElementById('displayNome');
    const dNum=document.getElementById('displayNumero');
    const container=document.querySelector('.txt-nome');

    dNum.innerText = num==="" ? "99" : num.toString().padStart(2,'0');
    dNome.innerText = (nome || "SNOOP DOGG").toUpperCase();

    let fs=22;
    dNome.style.fontSize=fs+'px';
    while(dNome.scrollWidth > container.offsetWidth && fs>8){
        fs--; dNome.style.fontSize=fs+'px';
    }
}

/* ===== MODAL TAMANHO ===== */
function abrirModal(){ document.getElementById('modalTamanho').style.display='flex'; }
function fecharModal(){ document.getElementById('modalTamanho').style.display='none'; }
function fecharModalExterno(e){
    const img=document.getElementById('imgModal');
    if(e.target!==img) fecharModal();
}

/* ===== ENVIO PARA APPS SCRIPT ===== */
async function enviarPedido(){
    const btn=document.getElementById('btnEnviar');
    const whatsapp=document.getElementById('whatsappCliente').value.replace(/\D/g,'');
    const nomeCli=document.getElementById('nomeCliente').value.trim();
    const camisaNom=document.getElementById('nomeCamisa').value.trim();
    const camisaNum=document.getElementById('numeroCamisa').value.trim();
    const tamanho=document.getElementById('tamanhoCamisa').value;

    if(!whatsapp || !nomeCli || !camisaNom || !camisaNum){
        alert('Preencha todos os campos!'); return;
    }

    btn.disabled=true;
    btn.innerText='Procurando partida...';

    // Salva localmente para a tela de pagamento
    const pedidoLocal={identificacao:nomeCli, nomeCamisa:camisaNom, numero:camisaNum, tamanho:tamanho};
    localStorage.setItem('pedidoCamisa', JSON.stringify(pedidoLocal));
    localStorage.setItem('user_whatsapp', whatsapp);

    const formData=new URLSearchParams();
    formData.append('action','CREATE_ORDER');
    formData.append('securityToken','TREM123');
    formData.append('telefone',whatsapp);
    formData.append('nomeCliente',nomeCli);
    formData.append('camisaNome',camisaNom);
    formData.append('camisaNum',camisaNum);
    formData.append('tamanho',tamanho);
    formData.append('operationId','op_'+Date.now()); // idempotência

    try{
        await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',body:formData});
        // Sucesso visual
        btn.innerText='Partida encontrada!';
        await new Promise(r=>setTimeout(r,800));
        window.location.href='pagamento.html';
    }catch(e){
        console.error(e);
        btn.disabled=false;
        btn.innerText='Falha ao conectar ao servidor';
        setTimeout(()=>{ btn.innerText='PROSSEGUIR PARA PAGAMENTO'; },3000);
    }
}
</script>
</body>
</html>
