<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Personalizar Camisa</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
    :root{--red:#cc0000;--black:#000;--gray:#1a1a1a}
    body{background:var(--black);color:#fff;font-family:sans-serif;margin:0;padding:15px;display:flex;flex-direction:column;align-items:center}
    h1{font-family:'Impact',sans-serif;color:var(--red);margin:10px 0;font-size:22px;text-transform:uppercase}
    .preview{display:flex;gap:10px;margin:15px 0;width:100%;max-width:360px}
    .box{position:relative;width:50%;background:var(--gray);border-radius:8px;border:1px solid #333;overflow:hidden}
    .box img{width:100%;display:block}
    .txt-nome,.txt-num{position:absolute;left:50%;transform:translateX(-50%);font-family:'Impact',sans-serif;color:#fff;text-align:center;white-space:nowrap}
    .txt-nome{top:22%;width:60%;font-size:16px}
    .txt-num{top:38%;font-size:42px}
    .form{background:var(--gray);padding:20px;border-radius:15px;width:100%;max-width:360px;border-top:4px solid var(--red);box-sizing:border-box}
    label{display:block;margin:10px 0 5px;font-size:12px;color:#888;text-transform:uppercase}
    input,select{width:100%;padding:12px;border-radius:5px;border:1px solid #444;background:#000;color:#fff;font-size:14px;box-sizing:border-box}
    .tam-row{display:flex;gap:8px;align-items:center}
    .tam-row select{flex:1}
    .info{width:38px;height:38px;background:var(--red);border:none;color:#fff;border-radius:5px;font-weight:bold;cursor:pointer}
    .btn{margin-top:20px;width:100%;padding:16px;background:var(--red);color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;text-transform:uppercase}
    .btn:disabled{background:#444}
    .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);align-items:center;justify-content:center;z-index:100}
    .modal.active{display:flex}
    .modal img{max-width:90%;border:2px solid var(--red);border-radius:10px}
</style>
</head>
<body>

<h1>Personalize sua Camisa</h1>

<div class="preview">
    <div class="box"><img src="Frente.png"></div>
    <div class="box">
        <img src="Costas.png">
        <div id="prevNome" class="txt-nome">SNOOP DOG</div>
        <div id="prevNum" class="txt-num">99</div>
    </div>
</div>

<div class="form">
    <label>WhatsApp (DDD + número)</label>
    <input type="tel" id="whats" placeholder="Ex.: 31991595612">
    <label>Seu nome (identificação)</label>
    <input type="text" id="cliNome" placeholder="Ex.: Boneco Bot">
    <label>Nome na Camisa</label>
    <input type="text" id="camisaNome" placeholder="Ex.: SNOOP DOG" oninput="upd()">
    <label>Número na Camisa</label>
    <input type="number" id="camisaNum" placeholder="99" oninput="upd()">
    <label>Tamanho</label>
    <div class="tam-row">
        <select id="tam"><option>P</option><option>M</option><option selected>G</option><option>GG</option><option>XG</option></select>
        <button class="info" onclick="document.getElementById('mSize').classList.add('active')">i</button>
    </div>
    <button id="btnEnviar" class="btn" onclick="criarPedido()">Concluir Pedido</button>
</div>

<div id="mSize" class="modal" onclick="this.classList.remove('active')"><img src="Tamanho.png"></div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyb8QC2CaDZXGdSrHUNTbsdwlxrNUVoUVLV8bNUTMnSXTuF-qvGG2uwMqCkZgs4dYiemg/exec";

function upd(){
    const n = document.getElementById('camisaNome').value || "SNOOP DOG";
    const num = document.getElementById('camisaNum').value;
    document.getElementById('prevNome').innerText = n.toUpperCase();
    document.getElementById('prevNum').innerText = num ? num.toString().padStart(2,'0') : "99";
}

async function criarPedido(){
    const btn = document.getElementById('btnEnviar');
    const zap = document.getElementById('whats').value.replace(/\D/g,'');
    const nome = document.getElementById('cliNome').value.trim();

    if(!zap || !nome){ alert("WhatsApp e Nome são obrigatórios!"); return; }

    btn.disabled = true;
    btn.innerText = "Procurando partida de liga...";

    try {
        // ENVIANDO COMO TEXT/PLAIN PARA EVITAR ERRO DE CORS NO NAVEGADOR
        await fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors', 
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({
                action: "CREATE_ORDER",
                whatsapp: zap,
                nome: nome,
                camisaNome: document.getElementById('camisaNome').value,
                camisaNumero: document.getElementById('camisaNum').value,
                tamanho: document.getElementById('tam').value
            })
        });

        localStorage.setItem('user_whatsapp', zap);
        btn.innerText = "PARTIDA ENCONTRADA!";
        btn.style.background = "#25d366";
        setTimeout(() => window.location.href='pagamento.html', 1500);
    } catch (e) {
        btn.disabled = false;
        btn.innerText = "ERRO AO ENVIAR. TENTE NOVAMENTE.";
    }
}
</script>
</body>
</html>
